function trT(){const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){if(n.parentNode.closest('option,script,style,textarea'))continue;const m=n.nodeValue.match(/^(\s*[^A-Za-z]*?)([A-Za-z][^]*?)(\s*)$/);if(!m)continue;const u=UR[m[2]];if(u)n.nodeValue=m[1]+u+m[3]}}
const obs=new MutationObserver(()=>{if(obs.q)return;obs.q=1;requestAnimationFrame(()=>{obs.q=0;obs.disconnect();trT();obs.observe(document.body,{childList:true,subtree:true})})});
function applyLang(){const u=LANG=='ur';document.documentElement.dir=u?'rtl':'ltr';document.documentElement.lang=u?'ur':'en';document.body.classList.toggle('ur',u);if(u){trT();obs.observe(document.body,{childList:true,subtree:true})}}
